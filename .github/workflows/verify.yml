name: Verify real PostgreSQL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: rehearsal_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-disposable-password
      PGDATABASE: rehearsal_demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.23'
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q --junitxml=test-results/junit.xml
      - run: uv run python scripts/setup_demo.py && uv run python scripts/demo.py
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/browser_check.py
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: postgres-evidence-python-${{ matrix.python }}
          path: |
            test-results/
            evidence/
            dist/
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker compose build tool
      - run: docker compose run --rm tool python scripts/setup_demo.py
      - run: docker compose run --rm tool python scripts/demo.py
      - run: test -s evidence/review.html
      - run: docker compose down -v
        if: always()
