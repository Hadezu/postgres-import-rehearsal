services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: rehearsal_demo
      POSTGRES_USER: rehearsal_demo
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rehearsal_demo -d rehearsal_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - rehearsal-db:/var/lib/postgresql
  tool:
    build: .
    environment:
      PGHOST: db
      PGDATABASE: rehearsal_demo
      PGUSER: rehearsal_demo
      PGPASSWORD: local-demo-only
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./evidence:/app/evidence
volumes:
  rehearsal-db:
