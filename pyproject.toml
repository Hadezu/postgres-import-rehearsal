[project]
name = "postgres-import-rehearsal"
version = "0.1.0"
description = "Review a bounded CSV import, apply it transactionally, and refuse unsafe undo."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4", "jinja2>=3.1.6,<4"]

[project.scripts]
import-rehearsal = "rehearsal.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "playwright>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rehearsal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

